server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-bpmn-platform
  ai:
    openai:
      # DeepSeek OpenAI兼容网关（Spring AI自动拼接 /v1/chat/completions）
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:unused}
      chat:
        options:
          model: ${AI_MODEL:deepseek-v4-flash}
          temperature: 0.1

app:
  ai:
    # 连接真实LLM时必须为false；无密钥调试时可临时改回true使用内置演示Mock
    mock-enabled: ${AI_MOCK_ENABLED:false}
    timeout-seconds: 60
    max-retries: 1
    max-input-characters: 30000
    max-conversation-messages: 10
    max-clarification-questions: 5
  bpmn:
    target-namespace: ${BPMN_TARGET_NAMESPACE:urn:bank:ai-bpmn}
    default-dialect: STANDARD_BPMN_20
    max-file-size-bytes: 10485760
    strict-extension-validation: true
    default-is-executable: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
